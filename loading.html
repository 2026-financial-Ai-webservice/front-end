<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <!-- 2. Google Fonts에서 Joan 폰트 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Joan&display=swap" rel="stylesheet">

    <div id="header-container"></div>
    <style>
    /* 로딩 전체 컨테이너 배경 */
    .loading-container {
    display: flex; 
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #e9e7a2; /* 와이어프레임 연두색 배경 */
    padding: 60px 20px;
    min-height: 91vh;
    text-align: center;
    }

    /* 중앙 대형 RedstocK 로고 */
    .loading-logo {
    font-family: "Joan", serif;
    font-size: 80px;
    color: #ffffff;
    margin: 0 0 30px 0;
    font-weight: normal;
    letter-spacing: -2px;
    }

    /* 흰색 박스 형태의 로딩 영역 */
    .pixel-loader-box {
    background-color: #f2f2f2;
    border: 2px solid #333;
    padding: 12px 20px;
    display: inline-block;
    margin-bottom: 40px;
    }

    .loader-header {
    font-family: monospace;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 6px;
    }

    .loader-footer {
    font-family: monospace;
    font-size: 11px;
    text-align: right;
    margin-top: 4px;
    color: #555;
    }

    /* 배터리 외곽 테두리 */
    .battery-frame {
    border: 3px solid #000;
    padding: 3px;
    display: flex;
    gap: 4px;
    background-color: #fff;
    width: 260px;
    height: 32px;
    box-sizing: border-box;
    }

    /* 배터리 각각의 칸 */
    .battery-bar {
    flex: 1;
    background-color: #000;
    opacity: 0; /* 기본은 안 보임 */
    animation: fillBattery 1.6s infinite;
    }

    .battery-bar.active {
        opacity: 1;
    }

    /* 하단 안내 문구 */
    .loading-text {
    font-size: 20px;
    color: #5B5A5A;
    line-height: 1.6;
    font-weight: 500;
    margin: 0;
    }   
    </style>
</head>

<body>
<!-- 로딩 화면 영역 (초기엔 숨김 처리 또는 분석 시작 시 표시) -->
<div id="loading-screen" class="loading-container">
  <h1 class="loading-logo">RedstocK</h1>
  
  <!-- 배터리 형태의 픽셀 로딩바 -->
  <div class="pixel-loader-box">
    <div class="loader-header">L O A D I N G . . .</div>
    <div class="battery-frame">
      <div class="battery-bar"></div>
      <div class="battery-bar"></div>
      <div class="battery-bar"></div>
      <div class="battery-bar"></div>
      <div class="battery-bar"></div>
      <div class="battery-bar"></div>
      <div class="battery-bar"></div>
      <div class="battery-bar"></div>
    </div>
    <!-- 실시간 퍼센트가 표시될 엘리먼트 -->
    <div class="loader-footer" id="progress-percent">0%</div>
  </div>

  <p class="loading-text">
    맞춤형 포트폴리오를 생성하고 있습니다.<br>
    잠시만 기다려주세요
  </p>
</div>
<script>
    //1. header 불러오기
    fetch('header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-container').innerHTML = data;
      })
      .catch(error => console.error('헤더를 불러오는 중 에러 발생:', error));

    // 2. 퍼센트 상승 및 배터리 바 차오르는 로직
    const batteryBars = document.querySelectorAll('.battery-bar');
    const percentText = document.getElementById('progress-percent');
    
    let progress = 0;
    const totalBars = batteryBars.length; // 8칸
    const duration = 2500; // 전체 로딩 시간 (2.5초)
    const intervalTime = 30; // 0.03초마다 업데이트
    const step = 100 / (duration / intervalTime);

    const timer = setInterval(() => {
      progress += step;

      if (progress >= 100) {
        progress = 100;
        clearInterval(timer);
        
        // 100% 도달 후 0.3초 뒤 대시보드로 이동
        setTimeout(() => {
          window.location.href = 'result_summary.html';
        }, 300);
      }

      // 퍼센트 텍스트 업데이트
      percentText.textContent = `${Math.floor(progress)}%`;

      // 퍼센트 비율에 맞춰 배터리 칸(8개) 활성화
      const activeBarCount = Math.floor((progress / 100) * totalBars);
      batteryBars.forEach((bar, index) => {
        if (index < activeBarCount) {
          bar.classList.add('active');
        } else {
          bar.classList.remove('active');
        }
      });
    }, intervalTime);
