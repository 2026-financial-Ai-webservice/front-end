<!DOCTYPE html>

<html lang="ko">

<head>

  <meta charset="UTF-8">

  <title>RedstocK Dashboard</title>

 <style>

  /* 브라우저 전체의 기본 여백을 강제로 지우고 스크롤바 왜곡 방지 */

  html, body {

    width: 100vw !important;

    min-height: 100vh !important;

    margin: 0 !important;

    padding: 0 !important;

    overflow-x: hidden;

    background-color: #ffffff !important; 

  }



  /* 외부 CSS나 부모 컨테이너의 간섭을 완전히 무력화하고 화면 가로폭을 100vw로 강제 확장 */

  .dashboard-container {

    width: 100vw !important; 

    max-width: none !important; 

    min-width: 100vw !important;

    box-sizing: border-box !important;

    margin: 0 !important;          

    padding: 24px !important;   

    position: relative;

    left: 0;

  }



  /* 상단 헤더 강제 확장 */

  #header-container {

    width: 100vw !important;

    max-width: none !important;

  }

  .header {

    background-color: #D53B3B !important;

    color: #FFFFFF !important;

    padding: 30px 40px !important;

    font-family: 'Joan', serif !important;

    font-size: 40px !important;

    letter-spacing: 1px !important;

    width: 100vw !important;

    box-sizing: border-box !important;

  }



  /* 상단 영역 그리드 */

  .top-section {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 20px;

    margin-bottom: 24px;

    align-items: stretch;

    width: 100% !important;

  }

  .summary-box {

    background-color: #e9e7a2;

    padding: 24px;

    border-radius: 8px;

  }

  .summary-box h2 {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-top: 0;

  }

  .summary-box p {

    margin: 0;

    padding: 12px 0;         

    font-size: 16px;

    line-height: 2.0;      

  }

  .chart-box {

    background-color: #e9e7a2;

    padding: 24px;

    border-radius: 8px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    height: 100%;

    box-sizing: border-box;

  }

  .chart-wrapper {

    background-color: #ffffff;

    padding: 24px;

    border-radius: 12px;

    width: 100%;

    max-width: 360px;

    min-height: 280px;      

    box-sizing: border-box;

    display: flex;

    flex-direction: column;

    align-items: center;    

    box-shadow: 0 2px 8px rgba(0,0,0,0.05);

  }

  .chart-wrapper h3 {

    margin-top: 0;

    margin-bottom: 20px;

    font-size: 18px;

    font-weight: bold;

    color: #1a1a1a;

    text-align: center;

    width: 100%;

  }

  .canvas-container {

    width: 100%;

    height: 200px; 

    position: relative;

  }



  /* 하단 5열 그리드 레이아웃 */

  .bottom-section {

    display: grid;

    grid-template-columns: repeat(5, 1fr);

    gap: 16px;

    width: 100% !important;

  }

  .stock-card {

    background-color: #e9e7a2;

    padding: 16px;

    border-radius: 8px;

    font-size: 14px;

    line-height: 1.5;

  }

  .stock-card h3 {

    font-size: 16px;

    margin-top: 0;

    border-bottom: 1px solid #e9e7a2;

    padding-bottom: 8px;

  }



  /* 모달 레이어 */

  .modal-overlay {

    position: fixed;

    top: 0;

    left: 0;

    width: 100vw;

    height: 100vh;

    background-color: rgba(0, 0, 0, 0.5); 

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 1000;

  }

  .modal-content {

    position: relative;

    background-color: #e9e7a2; 

    width: 90%;

    max-width: 650px;

    min-height: 500px;

    max-height: 85vh;

    overflow-y: auto; 

    padding: 40px 30px;

    border-radius: 4px;

    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);

    box-sizing: border-box;

  }

  .modal-close-btn {

    position: absolute;

    top: 15px;

    right: 20px;

    background: none;

    border: none;

    font-size: 28px;

    font-weight: bold;

    color: #333;

    cursor: pointer;

  }

  .modal-body {

    font-family: 'Malgun Gothic', sans-serif;

    color: #333;

    line-height: 1.8;

  }

  .modal-body ol {

    padding-left: 20px;

    font-size: 18px;

    font-weight: 500;

  }

  .modal-body li {

    margin-bottom: 20px;

  }

  .modal-body h4 {

    font-size: 20px;

    margin-bottom: 8px;

    color: #222;

  }

  .detail-sub-text {

    font-size: 14px;

    color: #555;

    margin-top: 4px;

    font-weight: normal;

  }

</style>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body> 

  <!-- 헤더 영역 -->
  <div id="header-container"></div>

  <!-- 대시보드 전체 컨테이너 -->
  <div class="dashboard-container">
    
    <!-- 상단 영역: 포트폴리오 요약 + Top 5 차트 -->
    <div class="top-section">
      <!-- 1. 포트폴리오 요약 -->
      <div class="summary-box">
        <h2>포트폴리오 요약 <button id="more-detail-btn" style="font-size: 12px; padding: 4px 8px; cursor: pointer;">+ 더보기</button></h2>
        <p>총 투자금: <strong id="total-amount">0원</strong></p>
        <p>예상 평균 시가배당률: <strong id="dividend-yield">0%</strong></p>
        <p>DCF 평균 상승여력: <strong id="dcf-upside">0%</strong></p>
      </div>

      <!-- 2. Top 5 추천 종목 차트 -->
      <div class="chart-box">
        <div class="chart-wrapper">
          <h3>Top 5 추천 종목</h3>
          <div class="canvas-container">
            <canvas id="top5Chart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. 하단 5개 종목 상세 카드 영역 -->
    <div id="stock-list-container" class="bottom-section"></div>

  </div>

  <!-- 상세 분석 모달 팝업 -->
  <div id="detail-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <button id="modal-close-btn" class="modal-close-btn">&times;</button>
      <div id="modal-body-content" class="modal-body">
        <!-- 동적으로 데이터가 들어갈 자리 -->
      </div>
    </div>
  </div>

</body>
</html>

  <div id="header-container"></div>

  <div class="dashboard-container">
    <div class="top-section">
      <div class="summary-box">
        <h2>포트폴리오 요약 <button id="more-detail-btn" style="font-size: 12px; cursor: pointer;">+ 더보기</button></h2>
        <p>총 투자금: <strong id="total-amount">0원</strong></p>
        <p>예상 평균 시가배당률: <strong id="dividend-yield">0%</strong></p>
        <p>DCF 평균 상승여력: <strong id="dcf-upside">0%</strong></p>
      </div>

      <div id="detail-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
          <button id="modal-close-btn" class="modal-close-btn">&times;</button>
          <div id="modal-body-content">
            </div>
        </div>
      </div>

      <div class="chart-box">
        <div class="chart-wrapper">
          <h3>Top 5 추천 종목</h3>
          <div class="canvas-container">
            <canvas id="top5Chart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div id="stock-list-container" class="bottom-section"></div>
  </div>

</body>
</html>
  <script>
let top5ChartInstance = null;

// ==========================================
// 1. 페이지 로드 시 백엔드 데이터 조회
// ==========================================
window.addEventListener('DOMContentLoaded', () => {
  // A. 헤더 조립
  fetch('header.html')
    .then(response => response.text())
    .then(data => {
      const headerContainer = document.getElementById('header-container');
      if (headerContainer) headerContainer.innerHTML = data;
    })
    .catch(error => console.error('헤더를 불러오는 중 에러 발생:', error));

  // B. URL 주소창에서 shareToken 추출
  const urlParams = new URLSearchParams(window.location.search);
  const shareToken = urlParams.get('token');

  if (!shareToken) {
    alert('잘못된 접근입니다. 처음부터 다시 진행해 주세요.');
    window.location.href = 'q1.html';
    return;
  }

  // C. 모달(더보기) 클릭 이벤트 제어 등록
  initModalEvents();

  // D. 백엔드로 GET 요청 보내기
  fetch(`https://api.financial-ai.p-e.kr/portfolios/${shareToken}`, {
    method: 'GET',
    headers: { 'Content-Type': 'application/json' }
  })
    .then(res => {
      if (!res.ok) throw new Error('포트폴리오 정보를 불러올 수 없습니다.');
      return res.json();
    })
    .then(data => {
      console.log('백엔드 응답 데이터:', data);
      
      // E. 받아온 데이터로 화면 전체 렌더링
      renderDashboard(data);
    })
    .catch(error => {
      console.error('GET 에러 발생:', error);
      alert('데이터를 불러오는데 실패했습니다.');
    });
});

// ==========================================
// 2. 화면 전체 렌더링 메인 함수
// ==========================================
function renderDashboard(data) {
  // A. 상단 요약 데이터 바인딩
  const totalAmountEl = document.getElementById('total-amount');
  const dividendYieldEl = document.getElementById('dividend-yield');
  const dcfUpsideEl = document.getElementById('dcf-upside');

  if (totalAmountEl && data.totalInvestment !== undefined) {
    totalAmountEl.textContent = `${Number(data.totalInvestment).toLocaleString('ko-KR')}원`;
  }
  if (dividendYieldEl && data.averageDividendYield !== undefined) {
    dividendYieldEl.textContent = `${data.averageDividendYield}%`;
  }
  if (dcfUpsideEl && data.averageDcfUpside !== undefined) {
    dcfUpsideEl.textContent = `${data.averageDcfUpside}%`;
  }

  // B. 모달(더보기) 내용 채우기 (3가지 AI 분석 리포트)
  const modalBody = document.getElementById('modal-body-content');
  if (modalBody) {
    modalBody.innerHTML = `
      <h3>포트폴리오 상세 분석</h3>
      <div style="margin-top: 15px; line-height: 1.6;">
        <h4 style="color: #4E73DF; margin-bottom: 5px;">1. 가치평가 분석 (DCF / PER)</h4>
        <p style="color: #555; font-size: 14px;">${data.valuationAnalysis || '내용 없음'}</p>
        
        <h4 style="color: #4E73DF; margin-top: 15px; margin-bottom: 5px;">2. 시장 지표 분석</h4>
        <p style="color: #555; font-size: 14px;">${data.marketIndicatorAnalysis || '내용 없음'}</p>
        
        <h4 style="color: #4E73DF; margin-top: 15px; margin-bottom: 5px;">3. 포트폴리오 비중 산출 분석</h4>
        <p style="color: #555; font-size: 14px;">${data.allocationAnalysis || '내용 없음'}</p>
      </div>
    `;
  }

  // C. Top 5 추천 종목 차트 & 하단 카드 렌더링
  if (data.companies && data.companies.length > 0) {
    // 백엔드에서 몇 개가 오든 여기서 깔끔하게 5개로 자릅니다.
    const top5Companies = data.companies.slice(0, 5); 
    
    // 차트와 카드 모두 동일하게 5개짜리 배열(top5Companies)을 넘겨줍니다.
    renderTop5Chart(top5Companies);
    renderStockCards(top5Companies);
  }
}

// ==========================================
// 3. 차트 렌더링 (Chart.js / 중복 방지 포함)
// ==========================================
function renderTop5Chart(companies) {
  const canvas = document.getElementById('top5Chart');
  if (!canvas) return;

  const ctx = canvas.getContext('2d');
  
  // 기존 차트가 있으면 삭제 후 새로 생성
  if (top5ChartInstance) { 
    top5ChartInstance.destroy(); 
  }

  const labels = companies.map(c => c.companyName);
  const weights = companies.map(c => c.allocationRatio);

  top5ChartInstance = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: labels,
      datasets: [{
        label: '배정 비율 (%)',
        data: weights,
        backgroundColor: ['#4E73DF', '#1CC88A', '#36B9CC', '#F6C23E', '#E74A3B'],
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom' }
      }
    }
  });
}

// ==========================================
// 4. 하단 종목 카드리스트 렌더링
// ==========================================
function renderStockCards(companies) {
  const container = document.getElementById('stock-list-container');
  if (!container || !companies) return;

  container.innerHTML = ''; // 초기화

  companies.forEach(company => {
    const card = document.createElement('div');
    card.className = 'stock-card';
    card.innerHTML = `
      <div class="stock-header" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
        
        <div style="display: flex; flex-direction: column; gap: 4px; padding-right: 8px;">
          <h4 style="margin: 0; font-size: 16px; line-height: 1.2; word-break: keep-all;">
            <span style="color: #888; font-size: 13px; margin-right: 4px;">#${company.rankNo}</span>
            ${company.companyName}
          </h4>
          <span style="color: #888; font-size: 12px;">(${company.corpCode})</span>
        </div>

        <span class="badge" style="background: #eef2ff; color: #4f46e5; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 13px; white-space: nowrap; flex-shrink: 0;">
          ${company.allocationRatio}%
        </span>
        
      </div>
      
      <div class="stock-body" style="font-size: 14px; color: #555;">
        <p style="margin: 4px 0;">배정 금액: <strong>${Number(company.allocatedAmount || 0).toLocaleString('ko-KR')}원</strong></p>
        <p style="margin: 4px 0; font-size: 13px; color: #666; line-height: 1.4;">
          종합 점수: <strong>${company.finalScore}점</strong> | DCF: ${company.dcf}% | ROE: ${company.roe}% | PER: ${company.per || 'N/A'}배
        </p>
        ${company.investmentReason ? `<p style="margin-top: 8px; color: #2563eb; font-size: 13px; background: #f0f7ff; padding: 6px 10px; border-radius: 4px; line-height: 1.4;">💡 ${company.investmentReason}</p>` : ''}
      </div>
    `;
    container.appendChild(card);
  });
}
// ==========================================
// 5. 모달(더보기) 팝업 제어
// ==========================================
function initModalEvents() {
  const moreBtn = document.getElementById('more-detail-btn');
  const modal = document.getElementById('detail-modal');
  const closeBtn = document.getElementById('modal-close-btn');

  if (moreBtn && modal) {
    moreBtn.addEventListener('click', () => {
      modal.style.display = 'flex';
    });
  }

  if (closeBtn && modal) {
    closeBtn.addEventListener('click', () => {
      modal.style.display = 'none';
    });
  }

  if (modal) {
    window.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.style.display = 'none';
      }
    });
  }
}

  </script>

</body>
</html>
