<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>RedstocK Dashboard</title>
  <!-- 헤더가 들어갈 빈 위치 -->
  <div id="header-container"></div>
  <style>
    body {
    margin: 0;
    padding: 0;
    background-color: #ffffff; 
    }

    /* 대시보드 전체 컨테이너 */
    .dashboard-container {
    max-width: 1400px;       
    margin: 0 auto;          
    padding: 24px 24px   
    }

    /* 상단 영역:포트폴리오 요약 + Top 5 차트 */
    .top-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
      align-items: stretch;
    }
    .summary-box {
      background-color: #e9e7a2;
      padding: 24px;
      border-radius: 8px;
    }
    .summary-box h2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0;
    }
    .summary-box p {
    margin: 0;
    padding: 12px 0;         
    font-size: 16px;
    line-height: 2.0;      
    }
    .chart-box {
    background-color: #e9e7a2;
    padding: 24px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    box-sizing: border-box;
    }
    .chart-wrapper {
    background-color: #ffffff;
    padding: 24px;
    border-radius: 12px;
    width: 100%;
    max-width: 360px;
    min-height: 280px;     
    box-sizing: border-box;
  
    /* 요소들을 위에서 아래로 중앙 정렬 */
    display: flex;
    flex-direction: column;
    align-items: center;    /* 제목, 차트를 중앙으로 배치 */
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    /* 흰 상자 내부 제목 스타일 */
    .chart-wrapper h3 {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 18px;
    font-weight: bold;
    color: #1a1a1a;
    text-align: center;
    width: 100%;
    }

    /* 도넛 그래프 자체의 높이 제한 */
    .canvas-container {
    width: 100%;
    height: 200px; 
    position: relative;
    }

    /* 하단 영역: 5열 그리드 레이아웃 */
    .bottom-section {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }
    .stock-card {
      background-color: #e9e7a2;
      padding: 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }
    .stock-card h3 {
      font-size: 16px;
      margin-top: 0;
      border-bottom: 1px solid #e9e7a2;
      padding-bottom: 8px;
    }

    /* 모달 배경 검은색 반투명 레이어 */
    .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.5); /* 화면 어둡게 */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    }

    /* 와이어프레임과 동일한 노란색 카드 모달 상자 */
    .modal-content {
    position: relative;
    background-color: #e9e7a2; 
    width: 90%;
    max-width: 650px;
    min-height: 500px;
    max-height: 85vh;
    overflow-y: auto; /* 내용이 길어지면 스크롤 */
    padding: 40px 30px;
    border-radius: 4px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    box-sizing: border-box;
    }

    /* 닫기 (X) 버튼 */
    .modal-close-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    background: none;
    border: none;
    font-size: 28px;
    font-weight: bold;
    color: #333;
    cursor: pointer;
    }

    /* 모달 본문 텍스트 스타일 */
    .modal-body {
    font-family: 'Malgun Gothic', sans-serif;
    color: #333;
    line-height: 1.8;
    }

    .modal-body ol {
    padding-left: 20px;
    font-size: 18px;
    font-weight: 500;
    }

    .modal-body li {
    margin-bottom: 20px;
    }

    .modal-body h4 {
    font-size: 20px;
    margin-bottom: 8px;
    color: #222;
    }

    .detail-sub-text {
    font-size: 14px;
    color: #555;
    margin-top: 4px;
    font-weight: normal;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="dashboard-container">
  <!-- 상단 요약 영역 -->
  <div class="top-section">
    <!-- 1. 포트폴리오 요약 -->
    <div class="summary-box">
      <h2>포트폴리오 요약 <button id="more-detail-btn" style="font-size: 12px;">+ 더보기</button></h2>
      <p>총 투자금: <strong id="total-amount">0원</strong></p>
      <p>예상 평균 시가배당률: <strong id="dividend-yield">0%</strong></p>
      <p>DCF 평균 상승여력: <strong id="dcf-upside">0%</strong></p>
    </div>

    <!-- [더보기] 더보기 클릭 시 떠올라올 상세 모달 (팝업) -->
    <div id="detail-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
    <!-- 닫기 버튼 -->
    <button id="modal-close-btn" class="modal-close-btn">&times;</button>
    
    <!-- 모달 내부 상세 컨텐츠 영역 -->
    <div id="modal-body-content">
      <!-- 동적으로 데이터가 들어갈 자리 -->
    </div>
  </div>
</div>

    <!-- 2. Top 5 추천 종목 차트 -->
    <div class="chart-box">
      <div class="chart-wrapper">
        <h3>Top 5 추천 종목</h3>
        <div class="canvas-container">
        <canvas id="top5Chart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. 하단 5개 종목 상세 카드 영역 -->
  <div id="stock-list-container" class="bottom-section"></div>
</div>

  <script>
    let top5ChartInstance = null;

    // 백엔드 응답(JSON)을 받아서 화면 전체를 갱신하는 함수
    function renderRedstockDashboard(data) {
      // A. [상단 왼쪽] 포트폴리오 요약 데이터 텍스트 주입
      document.getElementById('total-amount').innerText = `${data.summary.totalAmount.toLocaleString()}원`;
      document.getElementById('dividend-yield').innerText = `연 ${data.summary.dividendYield}%`;
      document.getElementById('dcf-upside').innerText = `연 ${data.summary.dcfUpside}%`;

      // B. [상단 오른쪽] Top 5 도넛 차트 그리기
      const ctx = document.getElementById('top5Chart').getContext('2d');
      if (top5ChartInstance) { top5ChartInstance.destroy(); }

      top5ChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: data.stocks.map(s => `${s.name}: ${s.sharePercent}%`),
          datasets: [{
            data: data.stocks.map(s => s.sharePercent),
            backgroundColor: ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#1abc9c']
          }]
        },
        options: {
        responsive: true,
        maintainAspectRatio: false, // 💡 부모 wrapper 크기(200px)에 맞추도록 설정
        plugins: {
        legend: {
        position: 'right', // 범례 우측 배치
        labels: {
          boxWidth: 12,    // 범례 색상 상자 크기 축소
          font: { size: 11 } // 범례 폰트 크기 축소
            }
        }
        }
        }
      });

      // C. [하단] 카드 5개 동적 삽입
      const container = document.getElementById('stock-list-container');
      container.innerHTML = data.stocks.map(stock => `
        <div class="stock-card">
          <h3>${stock.name} | ${stock.code}</h3>
          <p>배정 금액: ${stock.amount.toLocaleString()}원 (${stock.sharePercent}%)</p>
          <p>종합 점수 뱃지: ${stock.score}점</p>
          <br>
          <p><strong>핵심 가치 지표</strong><br>
          EV/EBITDA ${stock.evEbitda}배<br>
          ROE ${stock.roe}%<br>
          DCF 상승여력: +${stock.dcfUpside}%</p>
          <br>
          <p><strong>AI 한 줄 요약</strong><br>
          ${stock.aiSummary}</p>
        </div>
      `).join('');
    }
    
    // 백엔드 fetch 연동
    //fetch('http://백엔드주소/api/v1/dashboard', { method: 'POST', /* ... */ })
    //  .then(res => res.json())
    //  .then(data => renderRedstockDashboard(data));


// 1. 와이어프레임 텍스트 내용을 그대로 담은 가짜 데이터 객체 생성
const mockDashboardData = {
  summary: {
    totalAmount: 10000000,
    dividendYield: 3.85,
    dcfUpside: 3.0
  },
  stocks: [
    // 5개 종목 데이터를 배열 안에 객체 형태로 작성
    {
      name: "삼성전자",
      code: "005930",
      amount: 3000000,
      sharePercent: 30, // 차트에 쓰일 비중 (%)
      score: 95,
      evEbitda: 5.2,
      roe: 12.4,
      dcfUpside: 18,
      aiSummary: "3년 연속 안정적 FCF 창출 및 사업보고서 상 신규 공장 증설로 장기 성장 가능성 높음"
    },
    {
      name: "A기업", // 와이어프레임 예시 텍스트
      code: "A00000",
      amount: 2500000,
      sharePercent: 25,
      score: 95,
      evEbitda: 5.2,
      roe: 12.4,
      dcfUpside: 18,
      aiSummary: "A기업에 대한 AI 한 줄 요약 텍스트가 들어갑니다. (와이어프레임 내용과 동일)"
    },
    {
      name: "B기업",
      code: "B00000",
      amount: 2000000,
      sharePercent: 20,
      score: 95,
      evEbitda: 5.2,
      roe: 12.4,
      dcfUpside: 18,
      aiSummary: "B기업에 대한 AI 한 줄 요약 텍스트가 들어갑니다."
    },
    {
      name: "C기업",
      code: "C00000",
      amount: 1500000,
      sharePercent: 15,
      score: 95,
      evEbitda: 5.2,
      roe: 12.4,
      dcfUpside: 18,
      aiSummary: "C기업에 대한 AI 한 줄 요약 텍스트가 들어갑니다."
    },
    {
      name: "D기업",
      code: "D00000",
      amount: 1000000,
      sharePercent: 10,
      score: 95,
      evEbitda: 5.2,
      roe: 12.4,
      dcfUpside: 18,
      aiSummary: "D기업에 대한 AI 한 줄 요약 텍스트가 들어갑니다."
    }
  ]
};

// 2. 가짜 데이터를 화면 그리기 함수(renderRedstockDashboard)에 강제로 주입!
// 이렇게 하면 백엔드 없이도 즉시 화면이 텍스트로 채워집니다.
renderRedstockDashboard(mockDashboardData);

//더보기 팝업

// 백엔드에서 받아올 데이터 예시 (테스트용 가짜 데이터)
const mockDetailData = {
  dcfSummary: "기업별 3개년 FCF(순현금흐름) 추정 및 영구가치 산출을 통한 목표주가 괴리율 분석",
  marketCapInfo: "KOSPI/KOSDAQ 시가총액 상위 종목 기준 최근 4분기 PER, PBR 반영 완료",
  portfolioProcess: "가치지표(EV/EBITDA, ROE, DCF)와 배당수익률을 종합 점수화(100점 만점)하여 가중치 배분"
};

// 모달 조작 및 데이터 렌더링 함수
function setupDetailModal(detailData) {
  const modal = document.getElementById('detail-modal');
  const moreBtn = document.getElementById('more-detail-btn');
  const closeBtn = document.getElementById('modal-close-btn');
  const modalBody = document.getElementById('modal-body-content');

  // 1. 백엔드 데이터를 와이어프레임 양식에 맞춰 HTML로 구성
  modalBody.innerHTML = `
    <div class="modal-body">
      <ol>
        <li>
          <strong>기업 별 DCF, EV-EBIT 산출과정 요약</strong>
          <p class="detail-sub-text">${detailData.dcfSummary || '상세 데이터 준비 중'}</p>
        </li>
        <li>
          <strong>시가총액, PER, PBR 기본정보</strong>
          <p class="detail-sub-text">${detailData.marketCapInfo || '상세 데이터 준비 중'}</p>
        </li>
        <li>
          <strong>기업 포트폴리오 비율 산출 과정 (점수화 과정) 설명</strong>
          <p class="detail-sub-text">${detailData.portfolioProcess || '상세 데이터 준비 중'}</p>
        </li>
      </ol>
    </div>
  `;

  // 2. 더보기 버튼 클릭 시 모달 열기
  moreBtn.addEventListener('click', () => {
    modal.style.display = 'flex';
  });

  // 3. X 버튼 클릭 시 모달 닫기
  closeBtn.addEventListener('click', () => {
    modal.style.display = 'none';
  });

  // 4. 모달 검은색 바깥 배경 클릭 시 닫기
  window.addEventListener('click', (event) => {
    if (event.target === modal) {
      modal.style.display = 'none';
    }
  });
}

// 💡 페이지 로드 후 실행
window.addEventListener('DOMContentLoaded', () => {
  // 백엔드 연결 후에는 localStorage에서 백엔드 데이터를 꺼내와서 전달하면 됩니다.
  const resultData = JSON.parse(localStorage.getItem('portfolioResult'));
  
  // 백엔드 데이터에 상세 정보(details)가 들어있다면 그걸 사용하고, 없으면 mockDetailData 사용
  const detailData = (resultData && resultData.details) ? resultData.details : mockDetailData;
  
  setupDetailModal(detailData);
});

    // 헤더
    fetch('header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-container').innerHTML = data;
      })
      .catch(error => console.error('헤더를 불러오는 중 에러 발생:', error));
  </script>

</body>
</html>
