<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redstock - Question 3</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Joan&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            background-color: #FFFFFF;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        .left-panel {
            width: 32vw;
            height: 100vh;
            background-color: #D53B3B;
            padding: 5vw 0;
            display: flex;
            flex-direction: column;
            align-items: center; 
            color: #FFFFFF;
        }

        .left-panel h1 {
            font-family: 'Joan', serif;
            font-size: 5vw;
            font-weight: 400;
            margin-bottom: 19vh;
            letter-spacing: -1px;
            text-align: center;
            width: 100%; 
        }

        .quote-box {
            display: flex;
            flex-direction: column;
            width: 80%; 
        }

        .quote-mark {
            font-family: 'Joan', serif;
            font-size: 6vw;
            line-height: 0.8;
        }

        .quote-mark.start {
            text-align: left;
            margin-bottom: 3vh; 
        }

        .quote-mark.end {
            text-align: right;
            margin-top: 7vh; 
        }

        .quote-text {
            font-family: 'Pretendard', sans-serif; 
            font-size: 2.3vw;
            font-weight: 700; 
            line-height: 1.4;
            letter-spacing: -1px;
            text-align: center; 
            margin: 0; 
        }

        .center-panel {
            width: 66vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .right-edge {
            width: 2vw;
            height: 100vh;
            background-color: #E9E7A2;
            border-left: 6px solid #D53B3B;
        }

        .q-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2vw;
            width: 100%;
        }

        .arrow {
            font-size: 3.5vw;
            color: #555555;
            font-weight: 300;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        .arrow:hover {
            color: #000000;
        }

        .q-box {
            width: 42vw;
            height: 52vh;
            background-color: #E9E7A2;
            border-radius: 20px;
            padding: 4vw;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .q-header {
            margin-bottom: 4vh;
        }

        .q-num {
            font-size: 1.8vw;
            font-weight: 800;
            color: #5B5A5A;
            margin-bottom: 0.5vh;
        }

        .q-title {
            font-size: 2vw;
            font-weight: 700;
            color: #5B5A5A;
            letter-spacing: -1px;
        }

  
        .cards-wrapper {
            display: flex;
            justify-content: space-between;
            gap: 1.5vw;
            width: 100%;
            flex-grow: 1; 
        }


        .risk-card-label {
            flex: 1;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .risk-card-label input[type="radio"] {
            display: none; 
        }

        .risk-card {
            background-color: #FFFFFF;
            height: 100%;
            padding: 2.5vw 2vw;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .risk-card-label:hover .risk-card {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.05);
        }

   
        .card-title-row {
            display: flex;
            align-items: center;
            margin-bottom: 3vh;
        }

       
        .custom-checkbox {
            width: 1.3vw;
            height: 1.3vw;
            background-color: #E9E9E9;
            margin-right: 0.8vw;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 2px;
        }

        .risk-card-label input[type="radio"]:checked + .risk-card .card-title-row .custom-checkbox::after {
            content: "✔";
            color: #D53B3B;
            font-size: 1.1vw;
        }

        .card-title {
            font-family: 'Pretendard', sans-serif;
            font-size: 1.3vw;
            font-weight: 700;
            color: #5B5A5A;
        }

        .card-desc {
            font-family: 'Pretendard', sans-serif;
            font-size: 1vw;
            font-weight: 500;
            color: #777777;
            line-height: 1.6;
            letter-spacing: -0.5px;
        }

        .page-indicator {
            position: absolute;
            bottom: 8vh;
            font-family: 'Joan', serif;
            font-size: 1.8vw; 
            color: #555555;
        }
    </style>
</head>
<body>

    <div class="left-panel">
        <h1>RedstocK</h1>
        <div class="quote-box">
            <div class="quote-mark start">“</div>
            <div class="quote-text">
                투자자님의<br>
                성향을 분석합니다
            </div>
            <div class="quote-mark end">”</div>
        </div>
    </div>

    <div class="center-panel">
        <div class="q-wrapper">
  
            <a href="question2.html" class="arrow" style="text-decoration: none;">&lt;</a>
            
            <div class="q-box">
                <div class="q-header">
                    <div class="q-num">Q3</div>
                    <div class="q-title">위험 성향을 선택하세요</div>
                </div>
                
                <div class="cards-wrapper">
                  
                    <label class="risk-card-label">
                        <input type="radio" name="risk_tolerance" value="안정형">
                        <div class="risk-card">
                            <div class="card-title-row">
                                <div class="custom-checkbox"></div>
                                <span class="card-title">안정형</span>
                            </div>
                            <div class="card-desc">
                                원금 보전 우선<br>
                                하락장 방어력이<br>
                                우수한 배당 및<br>
                                저평가 기업 선호
                            </div>
                        </div>
                    </label>
                    
                
                    <label class="risk-card-label">
                        <input type="radio" name="risk_tolerance" value="공격형">
                        <div class="risk-card">
                            <div class="card-title-row">
                                <div class="custom-checkbox"></div>
                                <span class="card-title">공격형</span>
                            </div>
                            <div class="card-desc">
                                고수익/손실<br>
                                감내
                            </div>
                        </div>
                    </label>
                </div>
            </div>
            
          
            <a href="question4.html" class="arrow" style="text-decoration: none;">&gt;</a>
        </div>
        
  
        <div class="page-indicator">3/5</div>
    </div>

    <div class="right-edge"></div>

</body>
</html>
