<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redstock - Main</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Joan&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #F3F4F6;
            /* 파일명을 '상한가그래프.png'로 정확히 수정했습니다 */
            background-image: linear-gradient(rgba(243, 244, 246, 0.85), rgba(243, 244, 246, 0.85)), url('상한가그래프.png');
            background-size: cover;
            background-position: center;
            font-family: 'Pretendard', sans-serif;
            overflow-x: hidden;
        }

        .outer-right-border {
            border-right: 8px solid #D53B3B;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        .main-container {
            position: relative;
            width: 1150px; 
            height: 750px; 
            background-color: #FFFFFF;
            border: 24px solid #E9E7A2;
            display: flex;
            flex-direction: column;
            align-items: center; 
        }

        .main-container::before {
            content: "";
            position: absolute;
            left: 0;
            top: -24px;
            bottom: -24px;
            width: 8px;
            background-color: #D53B3B;
            z-index: 2;
        }

        .title-box {
            width: 920px; 
            height: 320px; 
            background-color: #E9E7A2;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            z-index: 1;
            margin-top: 110px; 
        }

        .title-box h1 {
            font-family: 'Joan', serif;
            font-size: 200px; 
            font-weight: 400; 
            color: #000000;
            line-height: 1;
            white-space: nowrap;
            letter-spacing: -2px;
        }

        .start-btn {
            background-color: #D53B3B;
            color: #FFFFFF;
            font-family: 'Joan', serif;
            font-size: 24px;
            font-weight: 400;
            padding: 20px 80px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 2px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            z-index: 1;
            margin-top: auto; 
            margin-bottom: 60px; 
        }

        .start-btn:hover {
            background-color: #BE3232;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="outer-right-border">
        <div class="main-container">
            <div class="title-box">
                <h1>RedstocK</h1>
            </div>
            <a href="question.html" class="start-btn">START</a>
        </div>
    </div>

</body>
</html>
