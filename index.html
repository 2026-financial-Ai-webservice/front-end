<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>RedstocK</title>
    <style>
        /* 전체 페이지 리셋 및 배경 설정 */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff; /* 배경 흰색 */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 왼쪽 맨 끝에 붙는 세로 빨간 선 */
        .edge-red-line {
            position: absolute;
            top: 0;
            left: 0; /* 화면 가장 왼쪽 끝에 밀착 */
            width: 8px; /* 선 두께 (원하시는 두께로 조절 가능) */
            height: 100%;
            background-color: #d33838; /* 빨간색 포인트 */
        }

        /* 전체를 감싸는 베이지색 테두리 박스 (오른쪽/위/아래 대칭 맞춤) */
        .frame-container {
            position: absolute;
            top: 20px;
            left: 30px; /* 왼쪽 빨간 선과의 간격 고려 */
            right: 20px;
            bottom: 20px;
            border: 4px solid #e2dec7; /* 베이지색 테두리 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* RedstocK 타이틀 박스 */
        .title-box {
            background-color: #e2dec7;
            padding: 20px 60px;
            margin-bottom: 50px;
        }

        .title-text {
            font-family: serif;
            font-size: 64px;
            font-weight: bold;
            color: #000000;
            letter-spacing: 2px;
            margin: 0;
        }

        /* START 버튼 */
        .start-button {
            background-color: #d33838;
            color: #ffffff;
            font-family: serif;
            font-size: 20px;
            padding: 12px 40px;
            border: none;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .start-button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- 화면 맨 좌측 끝에 위치하는 세로 빨간 선 -->
    <div class="edge-red-line"></div>

    <!-- 나머지 타이틀과 버튼을 감싸는 프레임 -->
    <div class="frame-container">
        <div class="title-box">
            <h1 class="title-text">RedstocK</h1>
        </div>
        <button class="start-button">START</button>
    </div>

</body>
</html>
