  <!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redstock - Main</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Joan&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #FFFFFF; /* 깔끔한 순백색 배경 */
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        /* 화면 전체를 액자처럼 꽉 채우는 프레임 */
        .main-container {
            position: relative;
            width: 100vw; 
            height: 100vh; 
            border: 24px solid #E9E7A2; /* 네 면 모두 두꺼운 연두빛 테두리 */
            display: flex;
            flex-direction: column;
            align-items: center; 
        }

        /* 왼쪽 안쪽 연두색 테두리에 밀착한 빨간 선 */
        .main-container::before {
            content: "";
            position: absolute;
            left: 0;
            top: -24px;
            bottom: -24px;
            width: 8px;
            background-color: #D53B3B;
            z-index: 2;
        }

        /* 오른쪽 가장자리 외곽을 감싸는 빨간 선 */
        .main-container::after {
            content: "";
            position: absolute;
            right: -24px;
            top: -24px;
            bottom: -24px;
            width: 8px;
            background-color: #D53B3B;
            z-index: 2;
        }

        /* 화면 크기에 비례하여 확장된 타이틀 박스 */
        .title-box {
            width: 75vw; /* 화면 크기에 맞춰 유연하게 늘어나는 가로폭 */
            height: 420px; /* 세로 높이를 더 묵직하게 키움 */
            background-color: #E9E7A2;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            z-index: 1;
            /* 박스를 아래로 더 여유롭게 밀어내기 위해 20vh로 확장 */
            margin-top: 20vh; 
        }

        /* 존재감을 키운 RedstocK 타이포그래피 */
        .title-box h1 {
            font-family: 'Joan', serif;
            font-size: 260px; /* 폰트 사이즈 대폭 확대 */
            font-weight: 400; 
            color: #000000;
            line-height: 1;
            white-space: nowrap;
            letter-spacing: -3px; /* 글자가 커진 만큼 자간을 살짝 더 좁혀 정돈감 부여 */
        }

        /* START 버튼 */
        .start-btn {
            background-color: #D53B3B;
            color: #FFFFFF;
            font-family: 'Joan', serif;
            font-size: 26px; /* 버튼 글씨도 미세하게 확대 */
            font-weight: 400;
            padding: 22px 90px; /* 버튼 크기도 시원하게 키움 */
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 2px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            z-index: 1;
            margin-top: auto; 
            margin-bottom: 8vh; /* 전체 비율에 맞는 안정적인 하단 여백 */
        }

        .start-btn:hover {
            background-color: #BE3232;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="title-box">
            <h1>RedstocK</h1>
        </div>
        <a href="question.html" class="start-btn">START</a>
    </div>

</body>
</html>
