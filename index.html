<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redstock - Main</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #F3F4F6;
            background-image: linear-gradient(rgba(243, 244, 246, 0.85), rgba(243, 244, 246, 0.85)), url('your-chart-background.png');
            background-size: cover;
            background-position: center;
            font-family: 'Pretendard', sans-serif;
        }

        /* 바깥쪽 얇은 딥레드 선을 담당하는 래퍼 (좌우에만 적용) */
        .outer-red-border {
            border-left: 6px solid #D53B3B;
            border-right: 6px solid #D53B3B;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        /* 안쪽 두꺼운 연두빛 테두리를 담당하는 메인 컨테이너 */
        .main-container {
            width: 1100px;
            height: 750px;
            background-color: #FFFFFF;
            border: 24px solid #E9E7A2; /* 4면 모두 두꺼운 연두빛 테두리 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 90px 0;
        }

        /* Redstock 타이틀 박스 */
        .title-box {
            background-color: #E9E7A2;
            padding: 45px 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
        }

        .title-box h1 {
            font-size: 76px;
            font-weight: 700;
            font-family: 'Georgia', serif;
            color: #000000;
            letter-spacing: -1px;
        }

        /* START 버튼 */
        .start-btn {
            background-color: #D53B3B;
            color: #FFFFFF;
            font-size: 20px;
            font-weight: 600;
            padding: 18px 75px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 2px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .start-btn:hover {
            background-color: #BE3232;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- 좌우 빨간 선을 그려주는 바깥쪽 박스 -->
    <div class="outer-red-border">
        <!-- 네 방향 연두색 테두리를 그려주는 안쪽 박스 -->
        <div class="main-container">
            
            <div class="title-box">
                <h1>RedstocK</h1>
            </div>

            <a href="question.html" class="start-btn">START</a>
            
        </div>
    </div>

</body>
</html>
