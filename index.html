<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redstock - Main</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Joan&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #F3F4F6;
            background-image: linear-gradient(rgba(243, 244, 246, 0.85), rgba(243, 244, 246, 0.85)), url('your-chart-background.png');
            background-size: cover;
            background-position: center;
            font-family: 'Pretendard', sans-serif;
            overflow-x: hidden;
        }

        .outer-right-border {
            border-right: 8px solid #D53B3B;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        .main-container {
            position: relative;
            /* 비율에 맞춰 전체 컨테이너 크기도 살짝 축소하여 여백 확보 */
            width: 1150px; 
            height: 750px; 
            background-color: #FFFFFF;
            border: 24px solid #E9E7A2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 90px 0 70px 0;
        }

        .main-container::before {
            content: "";
            position: absolute;
            left: 0;
            top: -24px;
            bottom: -24px;
            width: 8px;
            background-color: #D53B3B;
            z-index: 2;
        }

        .title-box {
            /* 폰트와 함께 박스 크기 살짝 축소 */
            width: 920px; 
            height: 320px; 
            background-color: #E9E7A2;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            z-index: 1;
        }

        .title-box h1 {
            font-family: 'Joan', serif;
            /* 폰트 크기를 200px로 줄여서 부담감 감소 */
            font-size: 200px; 
            font-weight: 400; 
            color: #000000;
            line-height: 1;
            white-space: nowrap;
            letter-spacing: -2px;
        }

        .start-btn {
