<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 기기 화면 폭을 정상적으로 인식하게 만드는 필수 태그 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redstock - Main</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Joan&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #FFFFFF; 
            font-family: 'Pretendard', sans-serif;
            overflow: hidden; /* 가로 스크롤(화면 깨짐) 원천 차단 */
        }

        .main-container {
            position: relative;
            width: 100vw; 
            height: 100vh; 
            border: 24px solid #E9E7A2; 
            display: flex;
            flex-direction: column;
            align-items: center; 
        }

        .main-container::before {
            content: "";
            position: absolute;
            left: -24px; 
            top: -24px;
            bottom: -24px;
            width: 8px;
            background-color: #D53B3B;
            z-index: 2;
        }

        .main-container::after {
            content: "";
            position: absolute;
            right: -24px;
            top: -24px;
            bottom: -24px;
            width: 8px;
            background-color: #D53B3B;
            z-index: 2;
        }

        .title-box {
            width: 78vw; 
            /* [수정] 박스 높이를 440px 고정 대신 화면 크기에 비례(vh)하도록 수정하되, 최대 440px을 넘지 않게 잠금 */
            height: 40vh; 
            max-height: 440px; 
            background-color: #E9E7A2;
            display: flex;
            justify-content: center;
            align-items: center; 
            border-radius: 4px;
            z-index: 1;
            margin-top: 18vh; 
        }

        .title-box h1 {
            font-family: 'Joan', serif;
            /* [핵심 수정] 글씨 크기를 화면 폭에 비례(14vw)하게 쫙 늘었다 줄어들게 만들되, PC에서는 270px을 넘지 않게 잠금 */
            font-size: min(14vw, 270px); 
            font-weight: 400; 
            color: #000000;
            line-height: 1;
            white-space: nowrap;
            letter-spacing: -4px; 
        }

        .start-btn {
            background-color: #D53B3B;
            color: #FFFFFF;
            font-family: 'Joan', serif;
            font-size: 26px; 
            font-weight: 400;
            padding: 22px 90px; 
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 2px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            z-index: 1;
            position: absolute;
            bottom: 10vh; 
        }

        .start-btn:hover {
            background-color: #BE3232;
            transform: translateY(-2px);
        }

        /* 스마트폰 화면 전용 디테일 조정 (비율 유지) */
        @media screen and (max-width: 768px) {
            .main-container {
                border-width: 16px; /* 폰에서는 노란 테두리를 살짝 얇게 조절 */
            }
            .main-container::before, .main-container::after {
                left: -16px; /* 테두리 굵기에 맞춰 빨간 선 위치 재조정 */
                right: -16px;
            }
            .title-box h1 {
                font-size: 16vw; /* 폰에서는 글씨를 꽉 차게 살짝 더 키움 */
                letter-spacing: -2px;
            }
            .start-btn {
                padding: 16px 60px; /* 버튼 여백 축소 */
                font-size: 20px;    /* 버튼 글씨 축소 */
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="title-box">
            <h1>RedstocK</h1>
        </div>
        <a href="question.html" class="start-btn">START</a>
    </div>

</body>
</html>
