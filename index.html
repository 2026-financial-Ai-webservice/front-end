<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>RedstocK</title>
    <style> 
        body, html {
            height: 100%;
            margin: 0;
            display: flex; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            position: relative;
            z-index: 1;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('상한가그래프.png'); 
            background-size: cover;
            background-position: center -150px;
            background-repeat: no-repeat;
            filter: invert(100%) grayscale(100%) contrast(150%) brightness(120%) opacity(0.1);
            mix-blend-mode: multiply;
            z-index: -1; 
            -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
}
}
            flex-direction: column; {
            justify-content: center; 
            align-items: center;
            background: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)), url('상한가그래프_이미지경로.jpg');
            background-size: cover;
            background-position: center;
        }
        .title-box {
            border: 10px solid #C55252; 
            padding: 50px 100px;
            width: 1092px;
            height: 385px;
            text-align: center;
            margin-bottom: 50px;
        }
        .title-box h1 {
            font-family: 'Joan', serif; 
            font-weight: bold;
            font-size: 250px;
            margin: 0 0 20px 0;
            color: #000;
        }
        .title-box p {
            margin: 0;
            font-size: 25px;
            font-weight: bold;
            color: #333;
        }
        .start-btn {
            background-color: #C55252;
            font-family: 'Joan', serif;
            color: white;
            border: none;
            padding: 15px 80px;
            font-size: 28px;
            cursor: pointer;
            transition: background-color 0.3s; 
        }
        .start-btn:hover {
            background-color: #C55252; 
        }
    </style>
    
</head>
<body>
    <div class="title-box">
        <h1>Redstock</h1>
        <p>최적의 주식 포트폴리오를 만드세요</p>
    </div>
    <button class="start-btn">START</button>
</body>
</html>
