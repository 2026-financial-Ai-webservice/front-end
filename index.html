<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redstock - Main</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 배경 전체 톤 및 상한가 그래프 배경 이미지 설정 영역 */
            background-color: #F3F4F6;
            background-image: linear-gradient(rgba(243, 244, 246, 0.85), rgba(243, 244, 246, 0.85)), url('your-chart-background.png');
            background-size: cover;
            background-position: center;
            font-family: 'Pretendard', sans-serif;
        }

        /* 메인 화면 전체를 감싸는 액자형 컨테이너 */
        .main-container {
            position: relative;
            width: 1100px;
            height: 750px;
            background-color: #FFFFFF; /* 흰색 */
            border: 12px solid #D53B3B; /* 지정해주신 딥레드 테두리 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 90px 0;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        /* Redstock 타이틀 박스 */
        .title-box {
            background-color: #E9E7A2; /* 지정해주신 부드러운 그린 톤 배경 */
            padding: 45px 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
        }

        .title-box h1 {
            font-size: 76px;
            font-weight: 700;
            font-family: 'Georgia', serif;
            color: #000000; /* 지정해주신 블랙 */
            letter-spacing: -1px;
        }

        /* START 버튼 */
        .start-btn {
            background-color: #D53B3B; /* 지정해주신 딥레드 */
            color: #FFFFFF; /* 지정해주신 화이트 */
            font-size: 20px;
            font-weight: 600;
            padding: 18px 75px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 2px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(213, 59, 59, 0.3);
        }

        .start-btn:hover {
            background-color: #BE3232;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- 상단 타이틀 영역 -->
        <div class="title-box">
            <h1>RedstocK</h1>
        </div>

        <!-- 하단 START 버튼 영역 -->
        <a href="question.html" class="start-btn">START</a>
    </div>

</body>
</html>
