<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redstock - Question 5</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Joan&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            background-color: #FFFFFF;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        .left-panel {
            width: 32vw;
            height: 100vh;
            background-color: #D53B3B;
            padding: 5vw 0;
            display: flex;
            flex-direction: column;
            align-items: center; 
            color: #FFFFFF;
        }

        .left-panel h1 {
            font-family: 'Joan', serif;
            font-size: 5vw;
            font-weight: 400;
            margin-bottom: 19vh;
            letter-spacing: -1px;
            text-align: center;
            width: 100%; 
        }

        .quote-box {
            display: flex;
            flex-direction: column;
            width: 80%; 
        }

        .quote-mark {
            font-family: 'Joan', serif;
            font-size: 6vw;
            line-height: 0.8;
        }

        .quote-mark.start {
            text-align: left;
            margin-bottom: 3vh; 
        }

        .quote-mark.end {
            text-align: right;
            margin-top: 7vh; 
        }

        .quote-text {
            font-family: 'Pretendard', sans-serif; 
            font-size: 2.3vw;
            font-weight: 700; 
            line-height: 1.4;
            letter-spacing: -1px;
            text-align: center; 
            margin: 0; 
        }

        .center-panel {
            width: 66vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .right-edge {
            width: 2vw;
            height: 100vh;
            background-color: #E9E7A2;
            border-left: 6px solid #D53B3B;
        }

        .q-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2vw;
            width: 100%;
        }

        .arrow {
            font-size: 3.5vw;
            color: #555555;
            font-weight: 300;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        .arrow:hover {
            color: #000000;
        }

        .q-box {
            width: 42vw;
            min-height: 52vh;
            background-color: #E9E7A2;
            border-radius: 20px;
            padding: 4vw;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .q-header {
            margin-bottom: 4vh;
        }

        .q-num {
            font-size: 1.8vw;
            font-weight: 800;
            color: #5B5A5A;
            margin-bottom: 0.5vh;
        }

        .q-title {
            font-size: 2vw;
            font-weight: 700;
            color: #5B5A5A;
            letter-spacing: -1px;
        }

        .cards-wrapper {
            display: flex;
            justify-content: space-between;
            gap: 1.5vw;
            width: 100%;
            flex-grow: 1; 
        }

        .valuation-card-label {
            flex: 1;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .valuation-card-label input[type="radio"] {
            display: none; 
        }

        .valuation-card {
            background-color: #FFFFFF;
            height: 100%;
            padding: 4vh 2vw;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .valuation-card-label:hover .valuation-card {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.05);
        }

        .card-title-row {
            display: flex;
            align-items: center;
            margin-bottom: 3vh;
        }

        .custom-checkbox {
            width: 1.3vw;
            height: 1.3vw;
            background-color: #E9E9E9;
            margin-right: 0.8vw;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 2px;
        }

        .valuation-card-label input[type="radio"]:checked + .valuation-card .card-title-row .custom-checkbox::after {
            content: "✔";
            color: #D53B3B;
            font-size: 1.1vw;
        }

        .card-title {
            font-family: 'Pretendard', sans-serif;
            font-size: 1.3vw;
            font-weight: 700;
            color: #5B5A5A;
        }

        .card-desc {
            font-family: 'Pretendard', sans-serif;
            font-size: 1vw;
            font-weight: 500;
            color: #777777;
            line-height: 1.6;
            letter-spacing: -0.5px;
        }

        .page-indicator {
            position: absolute;
            bottom: 8vh;
            font-family: 'Joan', serif;
            font-size: 1.8vw; 
            color: #555555;
        }

        /* =================================================== */
        /* 📱 반응형 미디어 쿼리: 스마트폰 및 태블릿 접속 시 자동 발동 */
        /* =================================================== */
        @media screen and (max-width: 768px) {
            body {
                flex-direction: column; 
                height: auto;
                min-height: 100vh;
                overflow-x: hidden;
                overflow-y: auto; 
            }

            .left-panel {
                width: 100%;
                height: auto;
                min-height: 35vh;
                padding: 40px 20px;
                justify-content: center;
            }

            .left-panel h1 {
                font-size: 40px; 
                margin-bottom: 20px;
            }

            .quote-box {
                width: 90%;
            }

            .quote-mark {
                font-size: 40px;
            }

            .quote-text {
                font-size: 22px; 
            }

            .center-panel {
                width: 100%;
                height: auto;
                min-height: 65vh;
                padding: 40px 0;
            }

            .right-edge {
                display: none; 
            }

            .q-wrapper {
                width: 90%;
                gap: 10px;
            }

            .arrow {
                font-size: 30px; 
            }

            .q-box {
                width: 75vw; 
                min-height: auto;
                padding: 30px 20px;
            }

            .q-header {
                margin-bottom: 30px;
            }

            .q-num {
                font-size: 16px; 
            }

            .q-title {
                font-size: 20px; 
                word-break: keep-all; 
            }

            /* Q5 전용: 카드 레이아웃 모바일 최적화 (가로 배열 -> 세로 1열 배열로 변경) */
            .cards-wrapper {
                flex-direction: column; 
                gap: 15px; 
            }

            .valuation-card {
                padding: 20px; 
            }

            .card-title-row {
                margin-bottom: 15px;
            }

            .custom-checkbox {
                width: 24px; 
                height: 24px;
                margin-right: 12px;
            }

            .valuation-card-label input[type="radio"]:checked + .valuation-card .card-title-row .custom-checkbox::after {
                font-size: 18px; 
            }

            .card-title {
                font-size: 18px; 
            }

            .card-desc {
                font-size: 15px; 
                line-height: 1.5;
            }

            .page-indicator {
                position: static; 
                margin-top: 30px;
                font-size: 18px;
            }
        }
        /* =================================================== */
    </style>
</head>
<body>

    <div class="left-panel">
        <h1>RedstocK</h1>
        <div class="quote-box">
            <div class="quote-mark start">“</div>
            <div class="quote-text">
                투자자님의<br>
                성향을 분석합니다
            </div>
            <div class="quote-mark end">”</div>
        </div>
    </div>

    <div class="center-panel">
        <div class="q-wrapper">
            <a href="question4.html" class="arrow" style="text-decoration: none;">&lt;</a>
            
            <div class="q-box">
                <div class="q-header">
                    <div class="q-num">Q5</div>
                    <div class="q-title">가치평가 지표를 선택하세요</div>
                </div>
                
                <div class="cards-wrapper">
                    <label class="valuation-card-label">
                        <input type="radio" name="valuation_metric" value="CURRENT_ASSET">
                        <div class="valuation-card">
                            <div class="card-title-row">
                                <div class="custom-checkbox"></div>
                                <span class="card-title">현재자산</span>
                            </div>
                            <div class="card-desc">
                                장부상 자산이 탄<br>
                                탄하고 당장 현금<br>
                                창출 대비 저평가<br>
                                된 기업
                            </div>
                        </div>
                    </label>
                    
                    <label class="valuation-card-label">
                        <input type="radio" name="valuation_metric" value="FUTURE_EARNINGS">
                        <div class="valuation-card">
                            <div class="card-title-row">
                                <div class="custom-checkbox"></div>
                                <span class="card-title">미래수익</span>
                            </div>
                            <div class="card-desc">
                                향후 사업 확장<br>
                                및 잉여현금흐<br>
                                름 증가 가능성<br>
                                이 높은 기업
                            </div>
                        </div>
                    </label>
                </div>
            </div>
            
            <a href="loading.html" class="arrow next-btn" style="text-decoration: none;">&gt;</a>
        </div>
        
        <div class="page-indicator">5/5</div>
    </div>

    <div class="right-edge"></div>

    <script>
        const nextBtn = document.querySelector('.next-btn');
        nextBtn.addEventListener('click', function(e) {
            const checkedOption = document.querySelector('input[name="valuation_metric"]:checked');
            if (!checkedOption) {
                e.preventDefault(); 
                alert('정확한 투자 성향 분석을 위해 선호하는 지표를 선택해 주세요!');
            } else {
                localStorage.setItem('valuationPreference', checkedOption.value);
            }
        });
    </script>

</body>
</html>
