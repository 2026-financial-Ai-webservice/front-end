<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redstock - Question 2</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Joan&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            background-color: #FFFFFF;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        .left-panel {
            width: 32vw;
            height: 100vh;
            background-color: #D53B3B;
            padding: 5vw 0;
            display: flex;
            flex-direction: column;
            align-items: center; 
            color: #FFFFFF;
        }

        .left-panel h1 {
            font-family: 'Joan', serif;
            font-size: 5vw;
            font-weight: 400;
            margin-bottom: 19vh;
            letter-spacing: -1px;
            text-align: center;
            width: 100%; 
        }

        .quote-box {
            display: flex;
            flex-direction: column;
            width: 80%; 
        }

        .quote-mark {
            font-family: 'Joan', serif;
            font-size: 6vw;
            line-height: 0.8;
        }

        .quote-mark.start {
            text-align: left;
            margin-bottom: 3vh; 
        }

        .quote-mark.end {
            text-align: right;
            margin-top: 7vh; 
        }

        .quote-text {
            font-family: 'Pretendard', sans-serif; 
            font-size: 2.3vw;
            font-weight: 700; 
            line-height: 1.4;
            letter-spacing: -1px;
            text-align: center; 
            margin: 0; 
        }

        .center-panel {
            width: 66vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .right-edge {
            width: 2vw;
            height: 100vh;
            background-color: #E9E7A2;
            border-left: 6px solid #D53B3B;
        }

        .q-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2vw;
            width: 100%;
        }

        .arrow {
            font-size: 3.5vw;
            color: #555555;
            font-weight: 300;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        .arrow:hover {
            color: #000000;
        }

        .q-box {
            width: 42vw;
            height: 52vh;
            background-color: #E9E7A2;
            border-radius: 20px;
            padding: 4vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .q-header {
            margin-bottom: 4vh;
        }

        .q-num {
            font-size: 1.8vw;
            font-weight: 800;
            color: #5B5A5A;
            margin-bottom: 0.5vh;
        }

        .q-title {
            font-size: 2vw;
            font-weight: 700;
            color: #5B5A5A;
            letter-spacing: -1px;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 3.5vh; 
            margin-left: 1vw; 
        }

        .option-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-family: 'Pretendard', sans-serif;
            font-size: 1.5vw;
            font-weight: 700;
            color: #5B5A5A;
            transition: color 0.2s;
        }

        .option-label:hover {
            color: #000000;
        }

        .option-label input[type="radio"] {
            display: none; 
        }

        .custom-box {
            width: 2.2vw;
            height: 2.2vw;
            background-color: #FFFFFF;
            margin-right: 1.5vw;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 2px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }

        .option-label input[type="radio"]:checked + .custom-box::after {
            content: "✔";
            color: #D53B3B;
            font-size: 1.5vw;
        }

        .page-indicator {
            position: absolute;
            bottom: 8vh;
            font-family: 'Joan', serif;
            font-size: 1.8vw; 
            color: #555555;
        }

        /* =================================================== */
        /* 📱 반응형 미디어 쿼리: 스마트폰 및 태블릿 접속 시 자동 발동 */
        /* =================================================== */
        @media screen and (max-width: 768px) {
            body {
                flex-direction: column; /* 세로 방향(위아래)으로 레이아웃 변경 */
                height: auto;
                min-height: 100vh;
                overflow-x: hidden;
                overflow-y: auto; /* 화면이 길어지면 자연스럽게 스크롤 허용 */
            }

            /* 상단 빨간 패널을 헤더처럼 깔끔하게 변경 */
            .left-panel {
                width: 100%;
                height: auto;
                min-height: 35vh;
                padding: 40px 20px;
                justify-content: center;
            }

            .left-panel h1 {
                font-size: 40px; /* 고정 크기로 읽기 편하게 변경 */
                margin-bottom: 20px;
            }

            .quote-box {
                width: 90%;
            }

            .quote-mark {
                font-size: 40px;
            }

            .quote-text {
                font-size: 22px; /* 스마트폰에서 읽을 수 있는 크기로 상향 조정 */
            }

            /* 아래쪽 노란 질문 영역 */
            .center-panel {
                width: 100%;
                height: auto;
                min-height: 65vh;
                padding: 40px 0;
            }

            .right-edge {
                display: none; /* 모바일에서는 의미 없는 장식선 숨김 */
            }

            .q-wrapper {
                width: 90%;
                gap: 10px;
            }

            .arrow {
                font-size: 30px; /* 화살표 크기 고정 */
            }

            .q-box {
                width: 75vw; /* 스마트폰 화면 꽉 차게 넓힘 */
                height: auto;
                min-height: auto;
                padding: 30px 20px;
            }

            .q-header {
                margin-bottom: 30px;
            }

            .q-num {
                font-size: 16px; 
            }

            .q-title {
                font-size: 20px; /* 스마트폰 맞춤 폰트 크기 */
                word-break: keep-all; /* 단어 깨짐 방지 */
            }

            /* Q2 전용: 라디오 버튼 옵션들 모바일 최적화 */
            .options-group {
                gap: 20px;
                margin-left: 0;
            }

            .option-label {
                font-size: 16px; /* 글씨가 찌그러지지 않게 16px 고정 */
            }

            .custom-box {
                width: 24px; /* 체크박스 크기 고정 */
                height: 24px;
                margin-right: 12px;
            }

            .option-label input[type="radio"]:checked + .custom-box::after {
                font-size: 18px; /* 체크표시(✔) 크기 고정 */
            }

            .page-indicator {
                position: static; /* 겹치지 않게 상대 위치로 변경 */
                margin-top: 30px;
                font-size: 18px;
            }
        }
        /* =================================================== */
    </style>
</head>
<body>

    <div class="left-panel">
        <h1>RedstocK</h1>
        <div class="quote-box">
            <div class="quote-mark start">“</div>
            <div class="quote-text">
                투자자님의<br>
                성향을 분석합니다
            </div>
            <div class="quote-mark end">”</div>
        </div>
    </div>

    <div class="center-panel">
        <div class="q-wrapper">
            <a href="question.html" class="arrow" style="text-decoration: none;">&lt;</a>
            
            <div class="q-box">
                <div class="q-header">
                    <div class="q-num">Q2</div>
                    <div class="q-title">투자 가능 기간을 선택하세요</div>
                </div>
                
                <div class="options-group">
                    <label class="option-label">
                        <input type="radio" name="invest_period" value="UNDER_1_YEAR">
                        <div class="custom-box"></div>
                        1년 미만
                    </label>
                    <label class="option-label">
                        <input type="radio" name="invest_period" value="ONE_TO_THREE_YEARS">
                        <div class="custom-box"></div>
                        1년 이상 3년 미만
                    </label>
                    <label class="option-label">
                        <input type="radio" name="invest_period" value="OVER_3_YEARS">
                        <div class="custom-box"></div>
                        3년 이상
                    </label>
                </div>
            </div>
            
            <a href="question3.html" class="arrow next-btn" style="text-decoration: none;">&gt;</a>
        </div>
        
        <div class="page-indicator">2/5</div>
    </div>

    <div class="right-edge"></div>

    <script>
        const nextBtn = document.querySelector('.next-btn');
        nextBtn.addEventListener('click', function(e) {
            const checkedOption = document.querySelector('input[name="invest_period"]:checked');
            if (!checkedOption) {
                e.preventDefault(); 
                alert('정확한 투자 성향 분석을 위해 투자 가능 기간을 선택해 주세요!');
            } else {
                localStorage.setItem('investmentPeriod', checkedOption.value);
            }
        });
    </script>

</body>
</html>
