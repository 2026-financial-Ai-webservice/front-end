<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redstock - Question 1</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Joan&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            background-color: #FFFFFF;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        /* 왼쪽 붉은색 패널 */
        .left-panel {
            width: 32vw;
            height: 100vh;
            background-color: #D53B3B;
            padding: 5vw 0;
            display: flex;
            flex-direction: column;
            align-items: center; 
            color: #FFFFFF;
        }

        .left-panel h1 {
            font-family: 'Joan', serif;
            font-size: 5vw;
            font-weight: 400;
            margin-bottom: 19vh;
            letter-spacing: -1px;
            text-align: center;
            width: 100%; 
        }

        .quote-box {
            display: flex;
            flex-direction: column;
            width: 80%; 
        }

        .quote-mark {
            font-family: 'Joan', serif;
            font-size: 6vw;
            line-height: 0.8;
        }

   
        .quote-mark.start {
            text-align: left;
            margin-bottom: 3vh; 
        }

        .quote-mark.end {
            text-align: right;
            margin-top: 7vh; 
        }

       
        .quote-text {
            font-family: 'Pretendard', sans-serif; 
            font-size: 2.3vw;
            font-weight: 700; 
            line-height: 1.4;
            letter-spacing: -1px;
            text-align: center; 
            margin: 0; 
        }

        .center-panel {
            width: 66vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .right-edge {
            width: 2vw;
            height: 100vh;
            background-color: #E9E7A2;
            border-left: 6px solid #D53B3B;
        }

        .q-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2vw;
            width: 100%;
        }

        .arrow {
            font-size: 3.5vw;
            color: #555555;
            font-weight: 300;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        .arrow:hover {
            color: #000000;
        }

        .q-box {
            width: 42vw;
            height: 52vh;
            background-color: #E9E7A2;
            border-radius: 20px;
            padding: 4vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .q-header {
            margin-bottom: 6vh;
        }

        .q-num {
            font-size: 1.8vw;
            font-weight: 800;
            color: #444444;
            margin-bottom: 0.5vh;
        }

        .q-title {
            font-size: 2vw;
            font-weight: 700;
            color: #444444;
            letter-spacing: -1px;
        }

        .input-area {
            display: flex;
            justify-content: center;
            margin-bottom: 3vh;
        }

        .input-area input {
            width: 75%;
            padding: 2.5vh 2vw;
            border: none;
            border-radius: 50px;
            font-size: 1.2vw;
            text-align: center;
            outline: none;
            font-family: 'Pretendard', sans-serif;
            color: #333333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .input-area input::placeholder {
            color: #BDBDBD;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 1.5vw;
        }

        .add-btn {
            background-color: #FFFFFF;
            border: none;
            padding: 1.2vh 1.8vw;
            border-radius: 50px;
            font-size: 1.1vw;
            font-weight: 700;
            color: #555555;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            font-family: 'Pretendard', sans-serif;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
        }

        .page-indicator {
            position: absolute;
            bottom: 8vh;
            font-family: 'Joan', serif;
            font-size: 1.8vw; 
            color: #555555;
        }
    </style>
</head>
<body>

    <div class="left-panel">
        <h1>RedstocK</h1>
        <div class="quote-box">
            <div class="quote-mark start">“</div>
            <div class="quote-text">
                투자자님의<br>
                성향을 분석합니다
            </div>
            <div class="quote-mark end">”</div>
        </div>
    </div>

    <div class="center-panel">
        <div class="q-wrapper">
            <a href="index.html" class="arrow" style="text-decoration: none;">&lt;</a>
            
            <div class="q-box">
                <div class="q-header">
                    <div class="q-num">Q1</div>
                    <div class="q-title">시드머니 규모를 입력하세요</div>
                </div>
                
                <div class="input-area">
                    <input type="text" placeholder="예: 5000(만)원">
                </div>
                
                <div class="btn-group">
                    <button class="add-btn">+10만원</button>
                    <button class="add-btn">+100만원</button>
                    <button class="add-btn">+1000만원</button>
                </div>
            </div>
            
            <a href="question2.html" class="arrow" style="text-decoration: none;">&gt;</a>
        </div>
        
        <div class="page-indicator">1/5</div>
    </div>

    <div class="right-edge"></div>

<script>
        const inputField = document.querySelector('.input-area input');
        
        inputField.addEventListener('input', function(e) {
       
            let value = e.target.value.replace(/원/g, '');
            
          
            if (value.length > 0) {
                e.target.value = value + '원';
                
                e.target.setSelectionRange(value.length, value.length);
            }
        });
    </script>

</body>
</html>
